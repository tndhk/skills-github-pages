<header class="bg-white shadow-sm sticky top-0 z-50">

    <div class="flex items-center space-x-3">
      <a href="{{ "/" | relative_url }}" class="text-2xl font-bold text-primary-600 hover:text-primary-700 transition-colors">
        {{ site.title }}
      </a>
    </div>

    <button type="button" aria-label="メニューを開閉" aria-controls="mobile-menu" aria-expanded="false" id="mobile-menu-btn" class="md:hidden p-2 hover:bg-gray-100 rounded-lg">

        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>

    <ul id="mobile-menu" class="hidden md:flex md:space-x-6 absolute md:static top-16 left-0 right-0 md:top-auto md:right-auto flex-col md:flex-row bg-white md:bg-transparent shadow-md md:shadow-none p-4 md:p-0">
      <li><a href="{{ "/" | relative_url }}" class="block py-2 md:py-0 hover:text-primary-600 transition-colors font-medium">ホーム</a></li>
      <li><a href="{{ '/#posts' | relative_url }}" class="block py-2 md:py-0 hover:text-primary-600 transition-colors font-medium">公開ページ</a></li>
      <li><a href="https://github.com/tndhk/skills-github-pages" target="_blank" rel="noopener noreferrer" class="block py-2 md:py-0 hover:text-primary-600 transition-colors font-medium">GitHub</a></li>
