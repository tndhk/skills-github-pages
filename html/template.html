<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>New HTML Template</title>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans JP", sans-serif;
      background: #061018;
      color: #e2e8f0;
      line-height: 1.7;
    }
    main {
      max-width: 960px;
      margin: 0 auto;
      padding: 40px 20px 56px;
    }
    .panel {
      background: rgba(15, 23, 42, 0.82);
      border: 1px solid rgba(148, 163, 184, 0.14);
      border-radius: 18px;
      padding: 24px;
      margin-bottom: 18px;
    }
    h1, h2 { margin-top: 0; }
    code {
      background: rgba(148,163,184,.12);
      border: 1px solid rgba(148,163,184,.18);
      padding: 0.12em 0.35em;
      border-radius: 6px;
      color: #fff;
    }
    .muted { color: #94a3b8; }
  </style>
</head>
<body>
  <main>
    <p><a href="./" style="color: #38bdf8">公開ページ一覧へ戻る</a></p>
    <section class="panel">
      <h1>New HTML Template</h1>
      <p class="muted">ここをコピーして新しいHTMLを増やす。</p>
    </section>

    <section class="panel">
      <h2>推奨パス</h2>
      <p><code>html/&lt;category&gt;/&lt;slug&gt;/index.html</code></p>
    </section>

    <section class="panel">
      <h2>やること</h2>
      <ol>
        <li>タイトルと内容を差し替える</li>
        <li>必要なら画像やJSを追加する</li>
        <li>_data/public_pages.yml にタイトル・説明・公開URLを登録する</li>
      </ol>
    </section>
  </main>
</body>
</html>
