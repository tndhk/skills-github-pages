---
layout: none
title: 公開ページ一覧
---
<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>公開ページ一覧</title>
  <style>
    :root {
      --bg: #07111c;
      --panel: rgba(15, 23, 42, 0.82);
      --line: rgba(148, 163, 184, 0.14);
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent2: #4ade80;
      --accent3: #e82127;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans JP", sans-serif;
      background:
        radial-gradient(circle at top left, rgba(56,189,248,.18), transparent 24%),
        radial-gradient(circle at 80% 16%, rgba(232,33,39,.15), transparent 20%),
        linear-gradient(180deg, #09111b 0%, #07111c 100%);
    }
    .wrap {
      width: min(1120px, calc(100% - 32px));
      margin: 0 auto;
      padding: 40px 0 56px;
    }
    header, section {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 18px;
      backdrop-filter: blur(10px);
      box-shadow: 0 12px 40px rgba(0,0,0,.18);
    }
    header { padding: 28px; margin-bottom: 20px; }
    h1 { margin: 0 0 10px; font-size: clamp(30px, 4vw, 48px); }
    p { color: var(--muted); line-height: 1.7; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 360px), 1fr));
      gap: 16px;
      margin: 20px 0;
    }
    .tool-card { grid-column: 1 / -1; }
    .card {
      background: rgba(2, 6, 23, 0.2);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 18px;
    }
    .tag, .eyebrow {
      display: inline-block;
      font-size: 12px;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 10px;
    }
    .card h2 { margin: 0 0 8px; font-size: 20px; }
    .card p { margin: 0 0 12px; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .btn {
      display: inline-block;
      padding: 10px 14px;
      border-radius: 999px;
      background: rgba(56,189,248,.14);
      border: 1px solid rgba(56,189,248,.26);
      color: #dff7ff;
      font-weight: 600;
    }
    .meta {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 14px;
      color: var(--muted);
      font-size: 14px;
    }
    .template {
      margin-top: 18px;
      padding: 18px;
      border-radius: 16px;
      border: 1px dashed rgba(148,163,184,.28);
      color: var(--muted);
      line-height: 1.7;
    }
    code {
      background: rgba(148,163,184,.12);
      border: 1px solid rgba(148,163,184,.18);
      padding: 0.12em 0.35em;
      border-radius: 6px;
      color: #fff;
    }
  </style>
</head>
<body>
  <main class="wrap">
    <header>
      <div class="tag">Public Library</div>
      <h1>公開ページ一覧</h1>
      <p>公開中のツールと旅行メモをまとめています。</p>
      <nav aria-label="サイトナビゲーション">
        <a class="btn" href="{{ '/' | relative_url }}">ホームへ戻る</a>
      </nav>
    </header>
    <section class="grid" aria-label="公開ツールと旅行メモ">
      {% include public-pages.html %}
    </section>
    <footer class="template">
      <a href="{{ '/html/template.html' | relative_url }}">ページ作成テンプレート</a>
      · <a href="https://github.com/tndhk/skills-github-pages">GitHub</a>
    </footer>
  </main>
</body>
</html>
