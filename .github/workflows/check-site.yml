name: Site navigation checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Jekyll
        run: |
          gem install jekyll -v 3.10.0 --no-document
          gem install jekyll-feed jekyll-seo-tag kramdown-parser-gfm --no-document
      - name: Build site
        run: jekyll build
      - name: Check links and page discovery
        run: python3 scripts/check_site.py _site
