# Site metadata

title: 公開ライブラリ
description: ポケモンのダメージ計算機と旅行計画・ガイド
author: tndhk
baseurl: /skills-github-pages

# Build settings
markdown: kramdown
future: true
plugins:
  - jekyll-feed
  - jekyll-seo-tag

# Collections
collections:
  posts:
    output: true
    permalink: /:categories/:year/:month/:day/:slug/

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: "index.html"
    values:
      layout: "none"

# Exclude from processing
exclude:
  - .gitignore
  - Gemfile
  - Gemfile.lock
  - node_modules
  - package.json
  - tailwind.config.js
  - .prettierrc
  - package-lock.json
  - README.md
  - MODERNIZATION.md
  - scripts
  - output
