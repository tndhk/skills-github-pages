# Site metadata

title: HTML Library
description: HTMLスライドや静的ページを増やしていく GitHub Pages 置き場
author: tndhk
baseurl: /skills-github-pages

# Build settings
markdown: kramdown
future: true
plugins:
  - jekyll-feed
  - jekyll-seo-tag

# Collections
collections:
  posts:
    output: true
    permalink: /:categories/:year/:month/:day/:slug/

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: "index.md"
    values:
      layout: "none"

# Exclude from processing
exclude:
  - .gitignore
  - Gemfile
  - Gemfile.lock
  - node_modules
  - package.json
  - tailwind.config.js
  - .prettierrc
